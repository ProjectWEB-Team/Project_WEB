# /etc/nginx/sites-available/uteexpress  (replace example.com with your domain)
server {
    listen 80;
    server_name example.com www.example.com;

    client_max_body_size 10m;
    # Compresses the HTML/CSS/JS/JSON the JSP pages and the 79 KB ute-modern.css send over the wire.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Default gzip_proxied off would skip compressing responses fetched from the Spring upstream.
    gzip_proxied any;
    # Requires deploy/nginx-auth-limits.conf in /etc/nginx/conf.d/.
    limit_req zone=uteexpress_auth burst=10 nodelay;
    limit_req_status 429;

    # Demo/test period only (docs/DEPLOY_AWS.md, step 8b):
    #auth_basic "UTEExpress test";
    #auth_basic_user_file /etc/nginx/.htpasswd;

    # Spring Security sends no-store on every response; static files may be cached but revalidated (304 when unchanged).
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, no-cache";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
