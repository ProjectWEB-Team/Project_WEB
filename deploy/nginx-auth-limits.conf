# Install in /etc/nginx/conf.d/uteexpress-auth-limits.conf (inside Nginx's http block).
# Empty keys leave ordinary page views, API reads and WebSocket messages uncounted.
map "$request_method:$uri" $uteexpress_auth_key {
    default "";
    ~^POST:/(login|register|auth/(phone-login|verify-phone(/resend)?|forgot-password|reset-password|google/complete|email/(register|verify|resend|forgot-password))|user/email|api/auth/login)/?$ $binary_remote_addr;
}
limit_req_zone $uteexpress_auth_key zone=uteexpress_auth:10m rate=10r/m;
