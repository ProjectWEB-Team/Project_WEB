# Copy to .local/account-providers.properties. That directory is ignored by Git.
# Fill the four values privately; never use a normal Google account password.
UTEEXPRESS_GOOGLE_CLIENT_ID=
UTEEXPRESS_GOOGLE_CLIENT_SECRET=
MAIL_USERNAME=
MAIL_PASSWORD=

# Gmail SMTP defaults. Override only when using another STARTTLS provider.
MAIL_HOST=smtp.gmail.com
MAIL_PORT=587
