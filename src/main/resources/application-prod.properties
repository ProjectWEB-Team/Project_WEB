# Production profile for the AWS EC2 deployment. All secrets come from environment variables
# (UTEEXPRESS_SQLSERVER_URL/USERNAME/PASSWORD, UTEEXPRESS_JWT_SECRET); see docs/DEPLOY_AWS.md.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Behind Nginx (HTTPS terminated there).
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

logging.level.root=INFO
