# Copy to application-local.properties and replace the placeholder values locally.
# SQL Server driver and JPA settings, including ddl-auto=none, inherit from application.properties.
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=ute_express;encrypt=true;trustServerCertificate=true;
spring.datasource.username=uteexpress_app
spring.datasource.password=YOUR_LOCAL_DB_PASSWORD

# Must be valid Base64 and decode to at least 32 bytes for HS256.
uteexpress.jwt.secret=YOUR_BASE64_LOCAL_JWT_SECRET
