# Copy to application-local.properties and enter your machine's private values there.
# The local file is ignored by Git. Driver/JPA settings inherit from application.properties.
# Activate with: --spring.profiles.active=local,otp-local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ute_express;encrypt=true;trustServerCertificate=true
spring.datasource.username=uteexpress_app
spring.datasource.password=YOUR_LOCAL_DB_PASSWORD

# Must be valid Base64 and decode to at least 32 bytes for HS256.
uteexpress.jwt.secret=YOUR_BASE64_LOCAL_JWT_SECRET
