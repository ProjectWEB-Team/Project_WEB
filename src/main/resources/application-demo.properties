# ===================================================================
# UTEEXPRESS LOGISTICS - DEMO FAST-FORWARD PROFILE
# Sử dụng khi demo đồ án: co ngắn thời gian từ 48 giờ xuống 2 phút
# Kích hoạt bằng cờ: --spring.profiles.active=demo
# ===================================================================

# Co ngắn timeout tự mang hàng ra bưu cục: 2 phút
uteexpress.timeout.dropoff-hours=0
uteexpress.timeout.dropoff-minutes=2

# Co ngắn timeout shipper liên hệ lấy hàng: 2 phút
uteexpress.timeout.pickup-hours=0
uteexpress.timeout.pickup-minutes=2

# Co ngắn thời gian ân hạn nhận hàng hoàn trước khi duyệt tiêu hủy: 2 phút
uteexpress.timeout.disposed-grace-days=0
uteexpress.timeout.disposed-grace-minutes=2
