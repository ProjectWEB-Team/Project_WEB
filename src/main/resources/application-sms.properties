# Opt in only after the SpeedSMS account is enabled for Verify/Notify SMS API.
uteexpress.otp.delivery-mode=speedsms
uteexpress.otp.speedsms.access-token=${SPEEDSMS_ACCESS_TOKEN:}
uteexpress.otp.speedsms.sender=${SPEEDSMS_SENDER:Verify}
# Empty uses the default UTEExpress OTP message; match the provider-approved template if required.
uteexpress.otp.speedsms.message-template=${SPEEDSMS_MESSAGE_TEMPLATE:}
