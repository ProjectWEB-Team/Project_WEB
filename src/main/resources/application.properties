# ===================================================================
# UTEEXPRESS LOGISTICS - APPLICATION CONFIGURATION
# Standard Three-Tier Architecture & HCMUTE Web Standards
# ===================================================================

# Application Information
spring.application.name=ute-express
server.port=8080

# -------------------------------------------------------------------
# 1. Database Connection (Microsoft SQL Server 2019+)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ute_express;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# -------------------------------------------------------------------
# 2. JPA & Hibernate Configuration
# BẮT BUỘC: ddl-auto=none để bảo toàn 25 bảng vật lý của docs/schema.sql
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Ngăn chặn Anti-pattern OpenSessionInView (Buộc Fetch LAZY rõ ràng tại Service)
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# 3. Spring MVC & JSP View Resolver
# Cấu hình đường dẫn thư mục JSP chuẩn Jakarta EE
# -------------------------------------------------------------------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Static Resources Mapping
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,/assets/

# -------------------------------------------------------------------
# 4. Bảo mật Session & Cookie (Theo LECTURE_STANDARDS.md)
# -------------------------------------------------------------------
server.servlet.session.cookie.name=UTEEXPRESS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# JWT signing material is mandatory and supplied only by environment/configuration.
uteexpress.jwt.secret=${UTEEXPRESS_JWT_SECRET:}
uteexpress.jwt.expiration-seconds=${UTEEXPRESS_JWT_EXPIRATION_SECONDS:1800}

# Giấu Stack Trace kỹ thuật khi gặp Exception (Anti-Information Leakage)
server.error.include-stacktrace=never
server.error.include-message=never

# -------------------------------------------------------------------
# 5. Cấu hình Email JavaMailSender (OTP Verification)
# -------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:uteexpress.logistics@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000

# -------------------------------------------------------------------
# 6. Kịch bản Thời gian Nghiệp vụ Thực tế (Production Defaults)
# -------------------------------------------------------------------
uteexpress.timeout.dropoff-hours=48
uteexpress.timeout.pickup-hours=48
uteexpress.timeout.disposed-grace-days=7
