# Opt in with the google profile after setting both environment values.
spring.security.oauth2.client.registration.google.client-id=${UTEEXPRESS_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${UTEEXPRESS_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
